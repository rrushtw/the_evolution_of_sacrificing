services:
  simulator:
    # ---- Build ----
    # Short form: equivalent to `context: . / dockerfile: Dockerfile`.
    build: .

    # ---- Identification ----
    container_name: sacrificing_simulator

    # ---- Lifecycle / behavior ----
    restart: on-failure:5
    init: true         # tini as PID 1 → clean Ctrl+C, no zombie processes
    tty: true          # pseudo-TTY → tqdm bar + ANSI colors render in place

    # ---- Configuration ----
    # All sim parameters live in .env (gitignored, copy from .env.example).
    # Shared with .devcontainer so dev shell and prod container see the same vars.
    env_file:
      - .env

    # ---- Storage ----
    volumes:
      # Strategies are hot-mounted — edit locally, next generation picks them up.
      - ./strategies:/app/strategies
      # Results land in ./output as JSON per run.
      - ./output:/app/output
